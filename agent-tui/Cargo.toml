[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
agent-core = { path = "crates/core" }
agent-git = { path = "crates/git" }
agent-zellij = { path = "crates/zellij" }
agent-harness = { path = "crates/harness" }
agent-store = { path = "crates/store" }
agent-term = { path = "crates/term" }
agent-tui = { path = "crates/tui" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
nix = { version = "0.31.3", features = ["signal", "fs"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tui-term = "0.3.4"
unicode-width = "0.2.3"
vt100 = "0.16.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
