# Actions on the agent selected in the `agent` TUI: `x`, then the key.
# Placeholders: {name}, {path} (its checkout), {repo} (the main checkout).
# Each action runs a command detached (`run`, an argv with no shell), runs one
# in the TUI's terminal (`interactive`), or asks the terminal to handle an
# event (`terminal_event`, an OSC 1337 user var). `cwd` sets where commands run.
#
# [keys]
# nav = "ctrl-\\"  # leaves the agent for NAV (default)

[[action]]
key = "d"
label = "dev server"
# wezterm/commands.lua handles this: pick a region, then open the dev tabs.
terminal_event = { name = "agent-spawn-dev", value = "{path}" }

[[action]]
key = "t"
label = "nvim in tab"
# wezterm/agent_edit.lua handles these two: open $EDITOR in the checkout in a
# new tab or a split right of the TUI. They need the TUI to run on this machine.
terminal_event = { name = "agent-edit", value = "tab|{path}" }

[[action]]
key = "r"
label = "nvim right"
terminal_event = { name = "agent-edit", value = "right|{path}" }

[[action]]
key = "o"
label = "open PR"
# gh finds the PR from the checkout's branch; with none, its error lands
# in the status bar.
run = ["gh", "pr", "view", "--web"]
cwd = "{path}"

[[action]]
key = "g"
label = "lazygit"
# Takes over the TUI's terminal until lazygit quits.
interactive = ["lazygit"]
cwd = "{path}"

# Repos the `p` picker and the `n` form offer beyond the ones shown: each
# entry is a repo or a directory of repos.
[repos]
dirs = ["~/repos/TandaHQ", "~/repos/DanielGilchrist"]

# evergarden, from nvim's MatchParen, Comment and Diagnostic* groups.
[theme]
accent = "#f7a182"
dim = "#839e9a"
warning = "#f5d098"
error = "#f57f82"
success = "#cbe3b3"
